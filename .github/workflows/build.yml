# Starts a production Android build on EAS for every push to master.
# The build runs on Expo's servers; this job only queues it (--no-wait), so it finishes in
# about a minute. Follow the build at expo.dev → Projects → yt-music-app → Builds.
#
# These are test builds: the version reads "<last release>-dev.<commit>", e.g. 1.2.0-dev.ea3c35e.
# EAS assigns the build number (versionCode), so every APK installs as an update.
name: EAS build

on:
  push:
    branches: [master]
    # Docs-only changes don't need a new APK.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to name the dev version after the last release

      - name: Set dev version
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v$(node -p "require('./app.json').expo.version")")
          node scripts/set-version.mjs "${LAST#v}-dev.${GITHUB_SHA::7}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Queue Android build
        run: eas build --platform android --profile production --non-interactive --no-wait

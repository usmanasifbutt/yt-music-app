# Builds the Android APK on GitHub's own runner (free for public repos) with
# `eas build --local`. Expo is only used for the build number and the signing key, which
# don't count towards Expo's monthly build limit.
#
# Run it by hand: Actions → Build APK → Run workflow (pick any branch). The APK is attached
# to the run as an artifact. The release workflow also calls it when a version tag is pushed.
name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: App version for this build, e.g. 1.6.1 (empty = "<last tag>-dev.<commit>")
        type: string
        default: ''
    outputs:
      apk-name:
        description: File name of the built APK (uploaded as the "apk" artifact)
        value: ${{ jobs.build.outputs.apk-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk-name: ${{ steps.version.outputs.apk-name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to name dev builds after the last release

      - name: Set version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v$(node -p "require('./app.json').expo.version")")
            VERSION="${LAST#v}-dev.${GITHUB_SHA::7}"
          fi
          node scripts/set-version.mjs "$VERSION"
          echo "apk-name=YT-Music-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      # The Android build needs more disk than the runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: |
          eas build --local --platform android --profile production --non-interactive \
            --output "${{ steps.version.outputs.apk-name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.version.outputs.apk-name }}
          retention-days: 14
          if-no-files-found: error


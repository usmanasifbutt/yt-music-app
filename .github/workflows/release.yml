# Pushing a version tag (e.g. v1.7.0) builds the APK on GitHub (see build.yml) and
# publishes it as a GitHub release. The tag sets the app version; EAS assigns the build
# number. Nothing needs to be committed first:
#
#   git tag -a v1.7.0 -m "v1.7.0" && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't a version like v1.7.0"; exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ needs.build.outputs.apk-name }}
        run: |
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "Download **$APK** below and open it on your phone. It installs over earlier versions and keeps your library."
            echo
            echo "SHA-256: \`$SHA\`"
            echo
            echo "> Downloading from YouTube is against YouTube's Terms of Service and, for copyrighted music, may infringe copyright where you live. Use it for content you have the right to keep."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YT Music $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

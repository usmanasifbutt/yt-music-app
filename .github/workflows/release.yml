# Pushing a version tag (e.g. v1.3.0) builds the production APK on EAS, waits for it,
# and publishes it as a GitHub release with the APK attached.
#
#   npm run bump -- minor
#   git commit -am "Release v1.3.0" && git tag -a v1.3.0 -m "v1.3.0" && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # EAS free-tier builds can queue for a while
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION. Run 'npm run bump' before tagging."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK on EAS
        id: build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::EAS build finished without an APK"; cat build.json; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          curl -fsSL "${{ steps.build.outputs.url }}" -o "YT-Music-$GITHUB_REF_NAME.apk"
          sha256sum "YT-Music-$GITHUB_REF_NAME.apk" | tee checksum.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Download **YT-Music-$GITHUB_REF_NAME.apk** below and open it on your phone. It installs over earlier versions and keeps your library."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 checksum.txt)\`"
            echo
            echo "> Downloading from YouTube is against YouTube's Terms of Service and, for copyrighted music, may infringe copyright where you live. Use it for content you have the right to keep."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "YT-Music-$GITHUB_REF_NAME.apk" \
            --title "YT Music $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
